server.port=8080
spring.application.name=kaamsetu

# Zero-friction local demo DB (swap to PostgreSQL AWS RDS in production)
spring.datasource.url=jdbc:h2:mem:kaamsetu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# PostgreSQL AWS RDS Production Template:
# spring.datasource.url=jdbc:postgresql://${RDS_HOST:localhost}:5432/kaamsetu
# spring.datasource.username=${RDS_USER:postgres}
# spring.datasource.password=${RDS_PASSWORD:postgres}
